name: Secret scan

# Fails the build when a new secret or plaintext password lands in the repo or its
# history. Complements GitHub secret scanning / push protection (enable those in
# Settings > Code security as well).
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '30 7 * * 1' # Mondays, after the dependency audit

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history, so old leaks cannot hide
      - name: Run gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.21.2 \
            detect --source /repo --config /repo/.gitleaks.toml \
            --redact --no-banner --verbose
