name: CI

# §4 item 8 — Gate every PR and push to main with lint + type-check + tests.
# This is the control that would have caught the Python/TypeScript regression
# divergence before it became a live bug: two implementations that disagreed
# on D2 (retract not restoring original values) for weeks before being caught
# manually.  A green CI badge is required before any branch can merge.
#
# NOTE (2026-08-03): the Python backend job that used to run here was
# removed when backend/ was retired — see
# docs/archive/backend-retired-2026-08-03/RETIRED.md. This app is now
# Supabase-only; there's no server left to lint/type-check/test.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  baseline-check:
    name: Baseline Migration — existence gate
    runs-on: ubuntu-latest
    # Fails fast if the consolidated baseline migration is missing.
    # The baseline migration (20260911044610_baseline_schema.sql) must exist
    # in supabase/migrations/ before any other migration jobs run.
    steps:
      - uses: actions/checkout@v4

      - name: Verify baseline migration exists and is non-empty
        run: |
          f="supabase/migrations/20260911044610_baseline_schema.sql"
          if [ ! -f "$f" ]; then
            echo "::error::Baseline migration missing: $f"
            exit 1
          fi
          SIZE=$(wc -c < "$f")
          if [ "$SIZE" -lt 100000 ]; then
            echo "::error::Baseline migration appears empty/truncated ($SIZE bytes): $f"
            exit 1
          fi
          echo "✅ Baseline migration verified: $f ($SIZE bytes)"

      - name: Fail if temp_migrations or rogue migration directories exist
        run: |
          if [ -d temp_migrations ]; then
            echo "::error::temp_migrations/ directory exists! All active migrations must live in supabase/migrations/."
            exit 1
          fi
          ROGUE_SQL=$(find . -maxdepth 2 -name "*.sql" -not -path "./supabase/*" -not -path "./tests/*" 2>/dev/null || true)
          if [ -n "$ROGUE_SQL" ]; then
            echo "::error::Rogue SQL files found outside allowed directories:"
            echo "$ROGUE_SQL"
            exit 1
          fi
          echo "✅ No rogue migration directories or SQL files found"

  typescript:
    name: TypeScript — type-check + build
    runs-on: ubuntu-latest
    needs: baseline-check

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node (from .nvmrc)
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Check types.ts is in sync with migrations
        run: node scripts/check-types-sync.mjs
        # Static, secret-free check — see the script's own header comment for
        # what it does and doesn't catch. Runs before tsc so a stale types.ts
        # is reported as one clear message instead of a wall of confusing
        # "column does not exist on <72 other tables>" downstream errors.

      - name: Type-check (tsc --noEmit)
        working-directory: frontend
        run: npx tsc --noEmit -p tsconfig.app.json
        # frontend/tsconfig.json has `files: []` and only project references
        # (it's a solution-style root config for editor tooling) — running
        # bare `tsc --noEmit` against it does nothing: no files, nothing to
        # check, exits 0 in ~5s regardless of how many real errors exist.
        # Confirmed directly: bare `tsc --noEmit` here takes ~5s and passes
        # unconditionally; `-p tsconfig.app.json` (the actual app project)
        # takes ~60s and does the real work. This exact regression happened
        # once before (see the CI hardening commit from the 2026-08-01
        # session that first pointed this at tsconfig.app.json) and
        # apparently reverted or got lost in a later merge — if it happens
        # again, that's the second time; worth finding out why it keeps
        # slipping rather than just re-adding the flag a third time.

      - name: Tests (vitest)
        working-directory: frontend
        run: npm test
        # This step didn't exist before 2026-08-10 -- every test in this repo,
        # including the guard-rail/regression-correction coverage added this
        # session (see pwri-improvement-plan.md Phase 2), ran only when
        # someone happened to run it locally. A red test suite could merge to
        # main and nothing here would have said so.

      - name: strictNullChecks (enforced globally via tsconfig.app.json)
        working-directory: frontend
        run: |
          # strictNullChecks is now ON project-wide (tsconfig.app.json
          # sets strictNullChecks: true). The codebase passed the incremental
          # allowlist ratchet (scripts/check-strict-null-checks.mjs) at its
          # target state of ZERO project-wide errors on 2026-09-08, so the
          # ratchet retired and the strictness is now enforced directly by the
          # Type-check (tsc --noEmit) step above - any future null-unsafe
          # code fails that step, not a per-file allowlist.
          node -e "console.log('strictNullChecks: globally ON (tsconfig.app.json sets strictNullChecks: true); enforced by the Type-check step.')"

      - name: Lint ceiling (ESLint warning count vs. committed baseline)
        working-directory: frontend
        run: node scripts/check-lint-ceiling.mjs
        # Replaces a hand-edited `--max-warnings=N` flag that was bumped five
        # times in six days (1540 -> 1547 -> 1555 -> 1565 -> 1586 -> 1616,
        # 2026-08-04 through 2026-08-09) as `@typescript-eslint/no-explicit-any`
        # warnings accumulated faster than they were fixed, and drifted stale
        # three of those five times from unrelated commits landing without
        # the flag being updated — meaning this gate had already gone stale
        # a fourth time (1620 actual vs. 1616 committed) before this script
        # replaced it. See lint-ceiling.json's `history` field for the
        # ongoing count instead of prose comments here; run
        # `node scripts/check-lint-ceiling.mjs --update` locally and commit
        # the result to move the ceiling in either direction on purpose.

      - name: Compact type-scale check (no undocumented text-[Npx] usages)
        working-directory: frontend
        run: node scripts/check-arbitrary-font-sizes.mjs

      - name: Theme contrast check (WCAG, all 7 brand themes)
        working-directory: frontend
        run: node scripts/check-theme-contrast.mjs
        # Gates on 3:1 (the UI-component floor) today, not 4.5:1 (full AA
        # text contrast) -- 3 of 7 themes (default, aerial-autumn,
        # midnight-road) currently sit between those two bars for white
        # button text on --primary (see the script's own header for the
        # full writeup). Reported in the check's own output either way, so
        # it's visible without blocking merges on a design decision this
        # check shouldn't make unilaterally. Tighten MIN_RATIO to 4.5 once
        # someone who owns the theme system has signed off on darkening
        # --primary a few points in those three themes.
        # tailwind.config.ts's text-3xs/text-2xs tokens exist so dense UI
        # doesn't fall back to one-off text-[Npx] values; the migration that
        # comment used to describe as unfinished (~16 occurrences, 7-11.5px)
        # was actually already done by the time this check was written —
        # only one real leftover (index.css's .section-label) plus a few
        # deliberately-excluded non-debt usages (Manual reader's own serif
        # type system, OdometerRollerInput's digit sizing, one responsive
        # label-collapse trick that isn't really a font size). See the
        # script's own header for the full allowlist and how to extend it.

      - name: Production build
        working-directory: frontend
        run: npm run build
        env:
          # Build needs VITE_ vars to exist even if fake — they're not
          # embedded into the output for the CI check, only used at Vite
          # config resolution time.
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: placeholder-anon-key

      - name: Bundle size vs. committed baseline
        working-directory: frontend
        run: node scripts/check-bundle-size.mjs
        # Roadmap Phase 2. Measures the gzipped JS/CSS this build just
        # emitted against bundle-size.json. Any drift (up OR down, like the
        # lint ceiling) must be re-baselined deliberately with --update and
        # committed with a reason, so bundle growth is always a reviewed
        # decision rather than an accumulation nobody was watching.

  e2e-smoke:
    name: E2E smoke (Playwright)
    runs-on: ubuntu-latest

    # Roadmap Phase 2: the smallest end-to-end tripwire — boots the real
    # dev server, loads the app in a real browser, and proves the shell
    # renders and the router sends anonymous visitors to /auth. Catches
    # blank-page/build-artifact/router regressions that vitest (jsdom,
    # mocked Supabase) structurally cannot. Needs no secrets and no
    # database; deeper authenticated flows are future work against the
    # staging project (docs/STAGING.md).
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run smoke tests
        working-directory: frontend
        run: npx playwright test
        env:
          # Same placeholders as the build step: the smoke test exercises
          # the shell + router, which must render without a backend.
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: placeholder-anon-key

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  e2e-authenticated:
    name: E2E authenticated (Playwright vs local Supabase)
    runs-on: ubuntu-latest
    needs: baseline-check

    # Roadmap Phase 2: runs the 5 critical authenticated workflows
    # against a disposable local Supabase instance (same one used by rls-tests).
    # Seeds test users (Operator/Manager/Admin) and sample data, then runs
    # the full E2E suite. Catches form submission, validation, and data
    # integrity bugs that unit tests cannot.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start local Supabase (applies baseline + subsequent migrations)
        run: supabase start

      - name: Seed E2E test data
        run: |
          # Get the local Supabase connection details
          DB_URL=$(supabase status --output json | jq -r '.db_url')
          psql "$DB_URL" -f supabase/e2e-seed.sql

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run authenticated E2E tests
        working-directory: frontend
        run: npx playwright test --grep="Workflow|Dashboard|Import"
        env:
          # Use the local Supabase instance
          VITE_SUPABASE_URL: http://localhost:54321
          VITE_SUPABASE_PUBLISHABLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0
          # Test credentials (matching the seeded users)
          E2E_EMAIL: e2e-operator@test.local
          E2E_PASSWORD: testpassword123

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-authenticated
          path: frontend/playwright-report/
          retention-days: 7

      - name: Stop local Supabase
        if: always()
        run: supabase stop

  rls-tests:
    name: RLS policy tests (pgTAP)
    runs-on: ubuntu-latest
    needs: baseline-check

    # 2026-08-18 review — "the single highest-leverage fix available": a
    # string of RLS gaps this month (well/locator/product/pump/cip/incidents
    # SELECT-bypass, blending_events' stray permissive UPDATE/DELETE
    # policies, reading_edit_audit_log excluding Data Analyst) each shipped
    # silently and were only caught by manual review, one at a time. This
    # job runs supabase/tests/database/*.sql (pgTAP) against a disposable
    # local Supabase instance built from this branch's own migrations —
    # not the real project, no secrets needed — so the next regression in
    # this family fails CI instead of waiting for another manual pass.
    # Every test file creates its own plants/users/rows and ends in
    # ROLLBACK, so nothing here depends on (or pollutes) seed data.
    #
    # 2026-09-11: Migrations squashed to single baseline (20260911044610_baseline_schema.sql)
    # verified 1:1 against live production database.
    # This job applies the baseline, verifying the full schema can be recreated from scratch.
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start local Supabase (applies baseline + subsequent migrations)
        run: supabase start

      - name: Run pgTAP RLS tests
        run: supabase test db

      - name: Stop local Supabase
        if: always()
        run: supabase stop

  npm-audit:
    name: npm audit (dependency vulnerabilities)
    runs-on: ubuntu-latest
    # Roadmap Phase 2: fails CI on high/critical vulnerabilities in dependencies.
    # Runs after install so it uses the exact lockfile. Non-blocking for
    # moderate/low (warns only) — high/critical fails the build.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run npm audit
        working-directory: frontend
        run: npm audit --audit-level=high
        # Use --audit-level=high to fail only on high/critical.
        # Moderate/low are reported but don't fail CI (too noisy for
        # this codebase's dependency tree). Adjust if policy changes.

  codeql:
    name: CodeQL analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    # Roadmap Phase 2: static analysis for security patterns in TypeScript/React.
    # Runs on push to main and scheduled weekly. Results uploaded to
    # GitHub Security tab for triage. Does not block merges on first
    # introduction (alerts only) — can be tightened to 'error' later.
    strategy:
      fail-fast: false
      matrix:
        language: [typescript]
    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          config-file: ./.github/codeql/codeql-config.yml
          queries: +security-extended,+security-and-quality

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
