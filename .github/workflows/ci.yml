name: CI

# §4 item 8 — Gate every PR and push to main with lint + type-check + tests.
# This is the control that would have caught the Python/TypeScript regression
# divergence before it became a live bug: two implementations that disagreed
# on D2 (retract not restoring original values) for weeks before being caught
# manually.  A green CI badge is required before any branch can merge.
#
# NOTE (2026-08-03): the Python backend job that used to run here was
# removed when backend/ was retired — see
# docs/archive/backend-retired-2026-08-03/RETIRED.md. This app is now
# Supabase-only; there's no server left to lint/type-check/test.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typescript:
    name: TypeScript — type-check + build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Check types.ts is in sync with migrations
        run: node scripts/check-types-sync.mjs
        # Static, secret-free check — see the script's own header comment for
        # what it does and doesn't catch. Runs before tsc so a stale types.ts
        # is reported as one clear message instead of a wall of confusing
        # "column does not exist on <72 other tables>" downstream errors.

      - name: Type-check (tsc --noEmit)
        working-directory: frontend
        run: npx tsc --noEmit -p tsconfig.app.json
        # frontend/tsconfig.json has `files: []` and only project references
        # (it's a solution-style root config for editor tooling) — running
        # bare `tsc --noEmit` against it does nothing: no files, nothing to
        # check, exits 0 in ~5s regardless of how many real errors exist.
        # Confirmed directly: bare `tsc --noEmit` here takes ~5s and passes
        # unconditionally; `-p tsconfig.app.json` (the actual app project)
        # takes ~60s and does the real work. This exact regression happened
        # once before (see the CI hardening commit from the 2026-08-01
        # session that first pointed this at tsconfig.app.json) and
        # apparently reverted or got lost in a later merge — if it happens
        # again, that's the second time; worth finding out why it keeps
        # slipping rather than just re-adding the flag a third time.

      - name: Tests (vitest)
        working-directory: frontend
        run: npm test
        # This step didn't exist before 2026-08-10 -- every test in this repo,
        # including the guard-rail/regression-correction coverage added this
        # session (see pwri-improvement-plan.md Phase 2), ran only when
        # someone happened to run it locally. A red test suite could merge to
        # main and nothing here would have said so.

      - name: Lint ceiling (ESLint warning count vs. committed baseline)
        working-directory: frontend
        run: node scripts/check-lint-ceiling.mjs
        # Replaces a hand-edited `--max-warnings=N` flag that was bumped five
        # times in six days (1540 -> 1547 -> 1555 -> 1565 -> 1586 -> 1616,
        # 2026-08-04 through 2026-08-09) as `@typescript-eslint/no-explicit-any`
        # warnings accumulated faster than they were fixed, and drifted stale
        # three of those five times from unrelated commits landing without
        # the flag being updated — meaning this gate had already gone stale
        # a fourth time (1620 actual vs. 1616 committed) before this script
        # replaced it. See lint-ceiling.json's `history` field for the
        # ongoing count instead of prose comments here; run
        # `node scripts/check-lint-ceiling.mjs --update` locally and commit
        # the result to move the ceiling in either direction on purpose.

      - name: Compact type-scale check (no undocumented text-[Npx] usages)
        working-directory: frontend
        run: node scripts/check-arbitrary-font-sizes.mjs
        # tailwind.config.ts's text-3xs/text-2xs tokens exist so dense UI
        # doesn't fall back to one-off text-[Npx] values; the migration that
        # comment used to describe as unfinished (~16 occurrences, 7-11.5px)
        # was actually already done by the time this check was written —
        # only one real leftover (index.css's .section-label) plus a few
        # deliberately-excluded non-debt usages (Manual reader's own serif
        # type system, OdometerRollerInput's digit sizing, one responsive
        # label-collapse trick that isn't really a font size). See the
        # script's own header for the full allowlist and how to extend it.

      - name: Production build
        working-directory: frontend
        run: npm run build
        env:
          # Build needs VITE_ vars to exist even if fake — they're not
          # embedded into the output for the CI check, only used at Vite
          # config resolution time.
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: placeholder-anon-key
