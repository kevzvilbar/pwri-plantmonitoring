name: Backfill Missing Readings Sweep

# Sweeps reading tables (locator, well, product, blending, power, ro_train) and backfills
# missing bounded date gaps using even delta distribution (<= 5 days) and
# rate-aware regression flow-rate curves (6-14 days).
#
# Runs on a routine schedule and supports manual workflow_dispatch.
# Skips dates with logged gap reasons (reading_gap_reasons) and never overwrites
# human entries (is_estimated = false).

on:
  schedule:
    - cron: '10 16 * * *'   # 16:10 UTC = 00:10 PHT next day
    - cron: '10 0 * * *'    # 00:10 UTC = 08:10 PHT
    - cron: '10 8 * * *'    # 08:10 UTC = 16:10 PHT
    - cron: '45 15 * * *'  # 15:45 UTC = 23:45 PHT — same-day best-effort sweep
  workflow_dispatch:
    inputs:
      date:
        description: 'Latest date to backfill through (YYYY-MM-DD). Defaults to yesterday PHT.'
        required: false
        type: string
      lookback_days:
        description: 'How many days back from "date" to scan for bounded gaps. Default 7.'
        required: false
        type: string

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - name: Call fn_backfill_missing_readings via Supabase REST
        env:
          SUPABASE_URL:          ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_ANON:         ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          TARGET_DATE:           ${{ inputs.date }}
          LOOKBACK_DAYS:         ${{ inputs.lookback_days }}
          SCHEDULE:              ${{ github.event.schedule }}
        run: |
          if [ -z "$TARGET_DATE" ]; then
            if [ "$SCHEDULE" = "45 15 * * *" ]; then
              TARGET_DATE=$(TZ='Asia/Manila' date '+%Y-%m-%d')
            else
              TARGET_DATE=$(TZ='Asia/Manila' date -d 'yesterday' '+%Y-%m-%d' 2>/dev/null \
                || TZ='Asia/Manila' date -v-1d '+%Y-%m-%d')
            fi
          fi
          if [ -z "$LOOKBACK_DAYS" ]; then
            LOOKBACK_DAYS=7
          fi

          if [ -z "$SUPABASE_URL" ]; then
            echo "ERROR: SUPABASE_URL (secrets.VITE_SUPABASE_URL) is not configured in GitHub repository secrets."
            exit 1
          fi

          API_KEY="${SUPABASE_SERVICE_ROLE:-$SUPABASE_ANON}"
          if [ -z "$API_KEY" ]; then
            echo "ERROR: Neither SUPABASE_SERVICE_ROLE_KEY nor VITE_SUPABASE_PUBLISHABLE_KEY is configured in GitHub repository secrets."
            exit 1
          fi

          CLEAN_URL="${SUPABASE_URL%/}"
          echo "Running backfill sweep through: $TARGET_DATE (lookback ${LOOKBACK_DAYS}d)${SCHEDULE:+ [schedule: $SCHEDULE]}"

          # Do not use curl --fail here: it exits before the response body can be
          # printed, which hides the PostgREST error behind exit code 22.
          HTTP_STATUS=$(curl --silent --show-error --retry 2 --retry-all-errors \
            --connect-timeout 15 --max-time 120 \
            -w "%{http_code}" -o /tmp/backfill_resp.json \
            -X POST \
            "${CLEAN_URL}/rest/v1/rpc/fn_backfill_missing_readings" \
            -H "apikey: ${API_KEY}" \
            -H "Authorization: Bearer ${API_KEY}" \
            -H "Content-Type: application/json" \
            -d "{\"p_date\": \"${TARGET_DATE}\", \"p_lookback_days\": ${LOOKBACK_DAYS}}")

          RESPONSE=$(cat /tmp/backfill_resp.json 2>/dev/null || echo "")
          echo "HTTP Status: $HTTP_STATUS"
          echo "Response: $RESPONSE"

          if [ "$HTTP_STATUS" -lt 200 ] || [ "$HTTP_STATUS" -ge 300 ]; then
            echo "ERROR: Supabase REST API returned HTTP $HTTP_STATUS: $RESPONSE"
            exit 1
          fi

          if ! printf '%s' "$RESPONSE" | jq -e '.ok == true' >/dev/null 2>&1; then
            echo "ERROR: backfill sweep did not report ok:true — check the response above."
            exit 1
          fi

          echo "Backfill sweep completed successfully through $TARGET_DATE."

