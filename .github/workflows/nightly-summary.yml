name: Nightly daily_plant_summary

# Runs at 00:05 PHT (16:05 UTC previous day) every day
# Calls fn_compute_daily_plant_summary() in Supabase for yesterday's data
# Also has a manual dispatch so you can trigger a backfill for any date

on:
  schedule:
    - cron: '5 16 * * *'   # 16:05 UTC = 00:05 PHT next day
  workflow_dispatch:
    inputs:
      date:
        description: 'Date to compute (YYYY-MM-DD). Defaults to yesterday PHT.'
        required: false
        type: string

jobs:
  compute-summary:
    runs-on: ubuntu-latest
    steps:
      - name: Call fn_compute_daily_plant_summary via Supabase REST
        env:
          SUPABASE_URL:          ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_ANON:         ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          TARGET_DATE:           ${{ inputs.date }}
        run: |
          # Determine which date to compute
          if [ -z "$TARGET_DATE" ]; then
            # Yesterday in PHT (UTC+8)
            TARGET_DATE=$(TZ='Asia/Manila' date -d 'yesterday' '+%Y-%m-%d' 2>/dev/null \
              || TZ='Asia/Manila' date -v-1d '+%Y-%m-%d')
          fi

          if [ -z "$SUPABASE_URL" ]; then
            echo "ERROR: SUPABASE_URL (secrets.VITE_SUPABASE_URL) is not configured in GitHub repository secrets."
            exit 1
          fi

          API_KEY="${SUPABASE_SERVICE_ROLE:-$SUPABASE_ANON}"
          if [ -z "$API_KEY" ]; then
            echo "ERROR: Neither SUPABASE_SERVICE_ROLE_KEY nor VITE_SUPABASE_PUBLISHABLE_KEY is configured in GitHub repository secrets."
            exit 1
          fi

          CLEAN_URL="${SUPABASE_URL%/}"
          echo "Computing daily summary for: $TARGET_DATE"

          # Do not use curl --fail here: it exits before the response body can be
          # printed, which hides the PostgREST error behind exit code 22.
          HTTP_STATUS=$(curl --silent --show-error --retry 2 --retry-all-errors \
            --connect-timeout 15 --max-time 120 \
            -w "%{http_code}" -o /tmp/summary_resp.json \
            -X POST \
            "${CLEAN_URL}/rest/v1/rpc/fn_compute_daily_plant_summary" \
            -H "apikey: ${API_KEY}" \
            -H "Authorization: Bearer ${API_KEY}" \
            -H "Content-Type: application/json" \
            -d "{\"p_date\": \"${TARGET_DATE}\"}")

          RESPONSE=$(cat /tmp/summary_resp.json 2>/dev/null || echo "")
          echo "HTTP Status: $HTTP_STATUS"
          echo "Response: $RESPONSE"

          if [ "$HTTP_STATUS" -lt 200 ] || [ "$HTTP_STATUS" -ge 300 ]; then
            echo "ERROR: Supabase REST API returned HTTP $HTTP_STATUS: $RESPONSE"
            exit 1
          fi

          if ! printf '%s' "$RESPONSE" | jq -e '.ok == true' >/dev/null 2>&1; then
            echo "ERROR: fn_compute_daily_plant_summary did not report ok:true — check the response above."
            exit 1
          fi

          # Check how many plants were processed
          PLANTS=$(printf '%s' "$RESPONSE" | jq -r '.plants_processed // 0' 2>/dev/null || echo "0")
          echo "Plants processed: $PLANTS"

          if [ "$PLANTS" -eq "0" ]; then
            echo "WARNING: No plants were processed. Check that plants have status='Active'."
            exit 1
          fi

          echo "Daily summary computed successfully for $TARGET_DATE ($PLANTS plants)"
