name: Derived-Meter Sweep

# Recomputes residual volume (mother meter − sibling locators) for every
# is_derived locator (e.g. Mambaling/Hamas at SRP — see
# supabase/migrations/20260722_mother_meter_derived.sql and
# 20260727_hamas_phase2_sweep_function.sql, which is what actually creates
# fn_sweep_derived_meters()) and mirrors it into any linked product_meters
# row.
#
# Runs every 8 hours — 00:00 / 08:00 / 16:00 PHT — so a sibling correction
# made during the day shows up in Hamas within 8h instead of waiting for the
# next midnight run. The 00:00 PHT run is kept at exactly 16:00 UTC, 5
# minutes BEFORE nightly-summary.yml (00:05 PHT), so fn_compute_daily_plant_summary
# still picks up the derived locator's volume in that same day's NRW.
#
# All three of the runs above sweep through "yesterday PHT" — a residual
# (mother meter − siblings) isn't well-defined for a day that's still in
# progress, since the mother meter and every sibling locator may not have
# logged their reading yet. That means TODAY's HAMAS/Mambaling number never
# appears until the *next* midnight-PHT run makes it "yesterday" — a full
# day's lag in the History dialog, by design, not a bug (confirmed while
# investigating a "why is Mambaling's HAMAS delayed a day" question).
#
# 23:30 PHT run (added for the above): a fourth, same-day, best-effort sweep
# — the one run that targets TODAY instead of yesterday. By 23:30 PHT most
# days are functionally complete, so this gives History a same-day figure
# instead of making everyone wait for tomorrow — but treat it as provisional:
# a reading logged in the last half hour of the day, or a same-day
# correction, won't be reflected until the next scheduled run picks it up
# (the 00:00 PHT run 30 minutes later, once today has become "yesterday", or
# the 08:00 PHT run's 3-day lookback otherwise).
#
# For same-day, on-demand recomputes (rather than waiting for 23:30 PHT),
# Managers / Data Analysts / Admins also have a "Recalculate now" button in
# Operations > Locator, which calls fn_sweep_derived_meters directly via
# Supabase RPC — it does not go through this workflow.
#
# Also has a manual dispatch so you can trigger a backfill for any date /
# lookback window.

on:
  schedule:
    - cron: '0 16 * * *'   # 16:00 UTC = 00:00 PHT next day (kept 5 min ahead of nightly-summary.yml)
    - cron: '0 0 * * *'    # 00:00 UTC = 08:00 PHT
    - cron: '0 8 * * *'    # 08:00 UTC = 16:00 PHT
    - cron: '30 15 * * *'  # 15:30 UTC = 23:30 PHT — same-day best-effort sweep (targets TODAY, not yesterday — see above)
  workflow_dispatch:
    inputs:
      date:
        description: 'Latest date to sweep (YYYY-MM-DD). Defaults to yesterday PHT.'
        required: false
        type: string
      lookback_days:
        description: 'How many days back from "date" to recompute (catches late corrections). Default 3.'
        required: false
        type: string

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      # 2026-08-17: switched from VITE_SUPABASE_PUBLISHABLE_KEY (the anon
      # key) to SUPABASE_SERVICE_ROLE_KEY. The anon key ships inside the
      # public frontend bundle by design, so granting this SECURITY DEFINER
      # function to `anon` so this job could call it meant anyone who ever
      # loaded the app could call it too, at any frequency, with any
      # p_date/p_lookback_days. See 20260817000000_sweep_function_revoke_anon.sql,
      # which revokes anon's EXECUTE grant to match.
      #
      # Requires a new repo secret, SUPABASE_SERVICE_ROLE_KEY (Supabase
      # dashboard -> Project Settings -> API -> service_role secret key).
      # Unlike the anon key this must never be exposed to the frontend --
      # it bypasses RLS -- so keep it only here, in GitHub Actions secrets.
      - name: Call fn_sweep_derived_meters via Supabase REST
        env:
          SUPABASE_URL:  ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TARGET_DATE:   ${{ inputs.date }}
          LOOKBACK_DAYS: ${{ inputs.lookback_days }}
          # The exact cron string that fired this run (unset for
          # workflow_dispatch) — lets the script below tell the new 23:30 PHT
          # same-day run apart from the other three yesterday-PHT runs
          # without needing four near-duplicate job definitions.
          SCHEDULE:      ${{ github.event.schedule }}
        run: |
          # Determine which date to sweep up to.
          #   1. Explicit input (workflow_dispatch) always wins.
          #   2. The 23:30 PHT same-day run targets TODAY PHT.
          #   3. Every other scheduled run (and a dispatch with no date)
          #      targets "yesterday PHT", same default as nightly-summary.yml.
          if [ -z "$TARGET_DATE" ]; then
            if [ "$SCHEDULE" = "30 15 * * *" ]; then
              TARGET_DATE=$(TZ='Asia/Manila' date '+%Y-%m-%d')
            else
              TARGET_DATE=$(TZ='Asia/Manila' date -d 'yesterday' '+%Y-%m-%d' 2>/dev/null \
                || TZ='Asia/Manila' date -v-1d '+%Y-%m-%d')
            fi
          fi
          if [ -z "$LOOKBACK_DAYS" ]; then
            LOOKBACK_DAYS=3
          fi

          echo "Sweeping derived meters through: $TARGET_DATE (lookback ${LOOKBACK_DAYS}d)${SCHEDULE:+ [schedule: $SCHEDULE]}"

          # Call the Postgres function via Supabase REST API /rpc endpoint
          RESPONSE=$(curl -sf \
            -X POST \
            "${SUPABASE_URL}/rest/v1/rpc/fn_sweep_derived_meters" \
            -H "apikey: ${SUPABASE_SERVICE_ROLE}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE}" \
            -H "Content-Type: application/json" \
            -d "{\"p_date\": \"${TARGET_DATE}\", \"p_lookback_days\": ${LOOKBACK_DAYS}}")

          echo "Response: $RESPONSE"

          OK=$(echo "$RESPONSE" | grep -o '"ok":[a-z]*' | grep -o '[a-z]*$' || echo "false")

          if [ "$OK" != "true" ]; then
            echo "WARNING: sweep did not report ok:true — check the response above."
            exit 1
          fi

          echo "Derived-meter sweep completed through $TARGET_DATE (lookback ${LOOKBACK_DAYS}d)."
