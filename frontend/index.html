<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      viewport-fit=cover lets the page draw under the notch/home-indicator
      area on notched phones (iPhone X+) instead of just letterboxing it in
      white/black. This is required for `env(safe-area-inset-*)` in CSS to
      resolve to anything other than 0 — without it, BottomNav's safe-area
      padding below is a silent no-op on exactly the devices that need it.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#070B0E" />
    <title>PWRI Monitoring</title>

    <!--
      CACHE-BUSTING: Tell browsers never to cache this HTML file.
      GitHub Pages serves index.html with Cache-Control: max-age=600 by default.
      Without this, browsers hold onto the old index.html after a new deployment,
      which references chunk filenames that no longer exist (causing the
      "Failed to fetch dynamically imported module" error on Operations/Costs/etc).

      These meta tags override the HTTP header at the browser level.
    -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />

    <meta
      name="description"
      content="PWRI Monitoring — production, water quality, and compliance dashboard for water-treatment plants."
    />
    <meta name="author" content="PWRI" />

    <!-- GitHub Pages SPA redirect fix -->
    <script>
      (function () {
        var redirect = sessionStorage.redirect;
        delete sessionStorage.redirect;
        if (redirect && redirect !== location.href) {
          history.replaceState(null, null, redirect);
        }
      })();
    </script>

    <!--
      DARK MODE: apply the persisted `dark` class before first paint.

      The app itself only toggles `document.documentElement.classList` from
      a useEffect in App.tsx (darkMode state, from useAppStore) — which runs
      after React mounts and after the browser's first paint. Without this,
      a returning user with dark mode on sees a flash of the light-mode
      :root colors (from index.css) on every load/reload, then a jarring
      snap to dark once React catches up. This mirrors the persisted state
      synchronously, before any CSS is even applied, so the correct theme
      is there for the very first frame. It only reads localStorage — it
      never writes, so it can't drift from what useAppStore persists.
    -->
    <script>
      (function () {
        try {
          var rawTheme = localStorage.getItem('pwri-theme-state');
          if (rawTheme) {
            var parsedTheme = JSON.parse(rawTheme);
            if (parsedTheme && parsedTheme.state) {
              if (parsedTheme.state.darkMode) {
                document.documentElement.classList.add('dark');
              }
              if (parsedTheme.state.colorTheme && parsedTheme.state.colorTheme !== 'default') {
                document.documentElement.setAttribute('data-theme', parsedTheme.state.colorTheme);
              }
            }
          } else {
            var raw = localStorage.getItem('pwri-app-state');
            if (raw) {
              var parsed = JSON.parse(raw);
              if (parsed && parsed.state) {
                if (parsed.state.darkMode) {
                  document.documentElement.classList.add('dark');
                }
                if (parsed.state.colorTheme && parsed.state.colorTheme !== 'default') {
                  document.documentElement.setAttribute('data-theme', parsed.state.colorTheme);
                }
              }
            }
          }
        } catch (e) {
          // Corrupt/inaccessible storage (e.g. private browsing) — fall back
          // to the default light theme; App.tsx's effect will still run.
        }
      })();
    </script>

    <!-- Google Fonts: Geist & JetBrains Mono -->
    <!--
      ROADMAP PHASE 3: the CSS2 URL is also PRELOADED as a style so the
      browser starts fetching the font stylesheet as early as possible
      while it still parses index.html. The <link rel="stylesheet">
      immediately after consumes that same cached resource, so fonts apply
      without adding a second network round-trip and without changing the
      render-blocking behavior. (preconnect is still hoisted above it.)
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700;800&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Cormorant+Garamond:wght@500;600;700&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap"
      as="style"
    />
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700;800&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Cormorant+Garamond:wght@500;600;700&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet" />

    <!-- Favicons -->
    <link rel="icon" type="image/png" sizes="any" href="%BASE_URL%favicon.png" />
    <link rel="icon" type="image/x-icon" href="%BASE_URL%favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="%BASE_URL%apple-touch-icon.png" />

    <!-- Open Graph -->
    <meta property="og:title" content="PWRI Monitoring" />
    <meta
      property="og:description"
      content="Production, water-quality, and compliance dashboard for water-treatment plants."
    />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="%BASE_URL%og-image.png" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="PWRI Monitoring" />
    <meta
      name="twitter:description"
      content="Production, water-quality, and compliance dashboard for water-treatment plants."
    />
    <meta name="twitter:image" content="%BASE_URL%og-image.png" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
